name: CI

# 分层触发策略（P0 恢复）：
#   - push / PR 自动触发：lint + 单元测试 + coverage + audit + 构建 —— 全部无需 GPU，CI 上可可靠运行
#   - E2E（tests/e2e*.mjs）需要真实 WebGPU + 本地 proxy/dev 服务器，GitHub hosted runner 无 GPU，
#     无法可靠运行，保持本地或手动执行：npm run test:e2e（需先启动 proxy 与 dev）
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 同一个分支的最新 run 会取消上一次 in-progress 的 run，节省 CI 分钟
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint / Test / Audit / Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, max-warnings=0)
        run: npm run lint -- --max-warnings=0

      - name: Unit tests (vitest)
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build (app + embed bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 构建只需 Node，无需 GPU：验证 dist/ 与 dist-embed/ 产物可正常产出
      # （嵌入产物损坏曾导致 eeef5f2 那类"浏览器中完全无法加载"的回归，构建门禁可提前拦截）
      - name: Build app
        run: npm run build

      - name: Build embed bundle
        run: npm run build:embed

      - name: Verify build outputs exist
        run: |
          set -e
          # 存在 + 非空：空文件同样意味着产物损坏（此前出现过"嵌入产物完全无法加载"的回归）
          test -s dist/index.html || (echo "::error::dist/index.html missing or empty" && exit 1)
          test -s dist/search.html || (echo "::error::dist/search.html missing or empty" && exit 1)
          test -s dist/sw.js || (echo "::error::dist/sw.js missing or empty" && exit 1)
          test -s dist-embed/local-agent.esm.js || (echo "::error::dist-embed/local-agent.esm.js missing or empty" && exit 1)
          test -s dist-embed/sw.js || (echo "::error::dist-embed/sw.js missing or empty" && exit 1)
          # 入口引用的相对 chunk 必须真实存在（拆包配置改坏时最典型的回归形态）
          missing=0
          for chunk in $(grep -oE '\./[A-Za-z0-9._-]+\.js' dist-embed/local-agent.esm.js | sort -u); do
            file="dist-embed/${chunk#./}"
            if [ ! -s "$file" ]; then
              echo "::error::missing chunk referenced by local-agent.esm.js: $file"
              missing=1
            fi
          done
          exit $missing

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            dist/
            dist-embed/
          retention-days: 7
