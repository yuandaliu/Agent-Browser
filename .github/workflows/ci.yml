name: CI

# 默认不自动执行：仅保留手动触发（Actions 页面点 "Run workflow"）。
# 需要恢复自动触发时，取消下面 push / pull_request 的注释即可。
on:
  workflow_dispatch:
  # push:
  #   branches: [master, main]
  # pull_request:
  #   branches: [master, main]

# 同一个分支的最新 run 会取消上一次 in-progress 的 run，节省 CI 分钟
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint / Test / Audit / Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, max-warnings=0)
        run: npm run lint -- --max-warnings=0

      - name: Audit (high severity must be 0)
        run: npm audit --audit-level=high

      - name: Unit tests (vitest)
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
