# GitHub Secret Scanning 配置
# 官方说明：本文件仅支持 paths-ignore（不支持自定义 patterns；
# 自定义模式需在 Settings -> Code security -> Secret scanning -> Custom patterns 配置）
# https://docs.github.com/en/code-security/secret-scanning/configuring-secret-scanning-for-your-repository
paths-ignore:
  # 浏览器端模型运行时构建产物：内含 transformers.js / web-llm 的类名与 HF model id，
  # 曾被误判为密钥，故整体跳过扫描（同时也已加入 .gitignore，不再被跟踪）
  - "dist-embed/**"
  - "dist/**"
  - "coverage/**"
  - "node_modules/**"
  # 本地历史备份目录，仅存在于开发机，绝不提交
  - ".git.backup-*/**"
