<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>示例官网 - 已嵌入本地智能体</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
    <style>
      /* ---------- 宿主页面自身样式（模拟"已有网站"） ---------- */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; background: #f8fafc; }
      .nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 48px; background: #fff; border-bottom: 1px solid #e5e7eb; }
      .nav .logo { font-weight: 800; font-size: 20px; color: #2563eb; }
      .nav a { margin-left: 24px; color: #475569; text-decoration: none; font-size: 14px; }
      .hero { text-align: center; padding: 80px 24px; background: linear-gradient(180deg, #eff6ff, #f8fafc); }
      .hero h1 { font-size: 40px; margin-bottom: 16px; }
      .hero p { color: #64748b; font-size: 16px; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px; max-width: 1080px; margin: 0 auto; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
      .card h3 { margin-bottom: 8px; color: #0f172a; }
      .card p { color: #64748b; font-size: 14px; }
      footer { text-align: center; padding: 24px; color: #94a3b8; font-size: 13px; border-top: 1px solid #e5e7eb; }

      /* ---------- 聊天浮窗（嵌入组件，独立作用域） ---------- */
      #la-fab {
        position: fixed; right: 24px; bottom: 24px; z-index: 9999;
        width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
        background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; font-size: 26px;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4); transition: transform 0.15s;
      }
      #la-fab:hover { transform: scale(1.06); }
      #la-panel {
        position: fixed; right: 24px; bottom: 92px; z-index: 9999;
        width: 380px; height: 560px; display: none; flex-direction: column;
        background: #0f172a; color: #e2e8f0; border-radius: 16px; overflow: hidden;
        box-shadow: 0 24px 60px rgba(2, 6, 23, 0.5); font-size: 14px;
      }
      #la-panel.open { display: flex; }
      #la-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #1e293b; border-bottom: 1px solid #334155; }
      #la-head .title { font-weight: 700; }
      #la-head .status { font-size: 12px; color: #94a3b8; }
      #la-toolbar { display: flex; gap: 8px; padding: 10px 12px; background: #0b1220; border-bottom: 1px solid #1e293b; }
      #la-toolbar select { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 12px; }
      #la-toolbar button { padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; background: #2563eb; color: #fff; }
      #la-toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
      #la-progress-wrap { display: none; padding: 8px 12px; background: #0b1220; }
      #la-progress-wrap .track { height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; }
      #la-progress-wrap .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #7c3aed); transition: width 0.25s; }
      #la-progress-wrap .meta { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: #94a3b8; }
      /* 消息区 + 输入区：由 src/chatWidget.js 统一渲染（样式见 src/chatWidget.css） */
      #la-chat { flex: 1; min-height: 0; display: flex; }
      /* 错误提示条（WebGPU 不支持 / 代理未启动 / 加载失败） */
      #la-error { padding: 8px 12px; background: #7f1d1d; color: #fecaca; font-size: 12px; line-height: 1.6; white-space: pre-line; }
      #la-error[hidden] { display: none; }
    </style>
  </head>
  <body>
    <!-- 宿主页面内容（模拟已有网站） -->
    <nav class="nav">
      <div class="logo">Acme 官网</div>
      <div><a href="#">首页</a><a href="#">产品</a><a href="#">关于</a><a href="#">联系</a></div>
    </nav>
    <div class="hero">
      <h1>欢迎来到 Acme</h1>
      <p>右下角的 🤖 按钮就是我们嵌入的本地智能体 —— 完全在浏览器中运行。</p>
    </div>
    <div class="cards">
      <div class="card"><h3>产品 A</h3><p>这是原有的页面内容，与智能体互不干扰。</p></div>
      <div class="card"><h3>产品 B</h3><p>嵌入的智能体不依赖任何服务器推理。</p></div>
      <div class="card"><h3>产品 C</h3><p>首次使用需下载模型并缓存（默认档大小见左侧下拉）。</p></div>
    </div>
    <footer>© 2026 Acme. 示例页面</footer>

    <!-- 聊天浮窗（data-local-agent-ui 会让 pageReader 读页面正文时排除自身 UI） -->
    <button id="la-fab" data-local-agent-ui title="打开本地智能体">🤖</button>
    <div id="la-panel" data-local-agent-ui>
      <div id="la-head">
        <div>
          <div class="title">本地智能体</div>
          <div class="status" id="la-status">初始化中…</div>
        </div>
        <button id="la-close" style="background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer">✕</button>
      </div>
      <div id="la-toolbar">
        <select id="la-model"></select>
        <button id="la-load">加载模型</button>
      </div>
      <div id="la-progress-wrap">
        <div class="track"><div class="bar" id="la-bar"></div></div>
        <div class="meta"><span id="la-pct">0%</span><span id="la-file">准备中…</span></div>
      </div>
      <div id="la-error" hidden></div>
      <div id="la-chat"></div>
    </div>

    <!-- 方式一（推荐，开发期）：直接 import 源码模块，由 dev server / 构建工具打包 -->
    <script type="module">
      import { createLocalAgent, getModelOptions, getDefaultModelId } from "/src/embed.js";
      import { createChatWidget } from "/src/chatWidget.js";

      // ---------- DOM 引用 ----------
      const el = {
        bar: document.getElementById("la-bar"),
        pct: document.getElementById("la-pct"),
        file: document.getElementById("la-file"),
        status: document.getElementById("la-status"),
        progressWrap: document.getElementById("la-progress-wrap"),
        errorBox: document.getElementById("la-error"),
        loadBtn: document.getElementById("la-load"),
        modelSelect: document.getElementById("la-model"),
      };

      function showError(message) {
        let text = message;
        // 首次加载模型需要下载代理；失败时给出可操作提示（宿主可按自己的文案调整）
        if (/proxy|Failed to fetch|NetworkError|404|ERR_/i.test(message)) {
          text += "\n提示：请先启动模型下载代理（新开终端执行 npm run proxy），再启动 npm run dev。";
        } else if (/WebGPU|不支持/i.test(message)) {
          text += "\n提示：请使用最新版 Chrome / Edge（chrome://gpu 可查看 WebGPU 状态）。";
        }
        el.errorBox.textContent = text;
        el.errorBox.hidden = false;
      }

      // ---------- 初始化智能体 ----------
      // modelId 默认 "auto"：ready() 探测硬件（WebGPU + 核数）后通过 onEvent 的
      // "model-recommended" 事件告知推荐档，下拉自动切到该项（详见 INTEGRATION.md Step 4）
      let maxProgress = 0;

      const agent = createLocalAgent({
        onEvent: (event) => {
          switch (event.type) {
            case "hardware": {
              if (!event.snapshot.webgpuSupported) {
                showError(
                  `当前浏览器不支持 WebGPU（${event.snapshot.webgpuReason ?? "未知原因"}），无法运行本地模型。`,
                );
              }
              break;
            }
            case "model-recommended": {
              // 硬件推荐档 → 自动切下拉（推荐事件在 ready() 时触发一次，后续不再触发，
              // 所以这里直接覆盖即可，不需要"用户手动改过就不再覆盖"的标志位）。
              el.modelSelect.value = event.modelId;
              const opt = getModelOptions().find((m) => m.id === event.modelId);
              el.modelSelect.title = opt ? `为你的设备推荐：${opt.label}` : "";
              break;
            }
            case "progress": {
              const pct = Math.round((event.progress ?? 0) * 100);
              // 进度可能回退（分片下载），取峰值避免进度条来回跳动
              maxProgress = Math.max(maxProgress, pct);
              el.bar.style.width = `${maxProgress}%`;
              el.pct.textContent = `${maxProgress}%`;
              if (event.file) el.file.textContent = event.file;
              else if (event.status) el.file.textContent = event.status;
              break;
            }
            case "status":
              el.status.textContent = event.message;
              break;
            case "ready":
              el.bar.style.width = "100%";
              el.pct.textContent = "100%";
              el.file.textContent = "加载完成";
              el.status.textContent = "已就绪 ✓";
              el.errorBox.hidden = true;
              el.errorBox.textContent = "";
              // 不禁用按钮：用户可从下拉换档后点「重新加载」（与 src/main.js 一致）
              el.loadBtn.textContent = "重新加载";
              el.loadBtn.disabled = false;
              widget.setEnabled(true);
              console.log("✅ 模型已就绪（嵌入 demo）:", event.modelId);
              break;
            case "error":
              showError(event.error?.message ?? String(event.error));
              // 失败时收起进度条，避免残留显示（与 src/main.js 一致）
              el.progressWrap.style.display = "none";
              el.loadBtn.textContent = "重试加载";
              el.loadBtn.disabled = false;
              break;
          }
        },
      });

      // ---------- 模型下拉（带 ⭐ 推荐标注，与 src/main.js 一致） ----------
      // agent.getAvailableModels()：只列出 SDK 目录中真实存在的档位，防止失效 id 出现在下拉里
      for (const option of agent.getAvailableModels()) {
        const opt = document.createElement("option");
        opt.value = option.id;
        opt.textContent = option.recommended ? `${option.label} ⭐` : option.label;
        opt.dataset.tier = option.tier;
        el.modelSelect.appendChild(opt);
      }
      // 先选最低档占位；ready() 收到 "model-recommended" 后自动切到推荐档
      el.modelSelect.value = getDefaultModelId();

      // ---------- 浮窗开关 ----------
      const panel = document.getElementById("la-panel");
      document.getElementById("la-fab").addEventListener("click", () => panel.classList.toggle("open"));
      document.getElementById("la-close").addEventListener("click", () => panel.classList.remove("open"));

      // ---------- 加载模型 ----------
      el.loadBtn.addEventListener("click", async () => {
        el.loadBtn.disabled = true;
        el.loadBtn.textContent = "加载中…";
        el.errorBox.hidden = true;
        el.progressWrap.style.display = "block";
        maxProgress = 0;
        try {
          await agent.ready(); // 幂等：初始化 IndexedDB / 事件 / 硬件探测
          // 用户当下拉里的值即他们想要的档（默认或手动改后），不强制使用"auto"
          await agent.load(el.modelSelect.value);
        } catch (err) {
          showError(err?.message ?? String(err));
          el.progressWrap.style.display = "none";
          el.loadBtn.textContent = "重试加载";
          el.loadBtn.disabled = false;
        }
      });

      // ---------- 聊天（统一组件：消息 / 思考过程 / 打字机 / 中止） ----------
      const widget = createChatWidget({
        container: document.getElementById("la-chat"),
        agent,
        welcomeHtml:
          "你好！我是嵌入本页面的本地智能体。点击「加载模型」后即可向我提问（如：现在几点 / 12*34 等于多少）。",
        onStatus: (msg) => showError(msg),
      });

      // ---------- 页面就绪 ----------
      await agent.ready();
      el.status.textContent = "就绪，等待加载模型";
      console.log("[embed-demo] 智能体已初始化，嵌入示例运行正常");
    </script>
  </body>
</html>
